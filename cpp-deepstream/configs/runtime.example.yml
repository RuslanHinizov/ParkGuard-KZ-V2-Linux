# =============================================================================
# cpp-deepstream/configs/runtime.example.yml
# -----------------------------------------------------------------------------
# Copy to runtime.yml and mount as /etc/parkguard/runtime.yml inside the
# container (or pass --config to parkguard_ds). For Adım 3 the MVP runs one
# camera; Adım 11 just adds more entries to the `cameras` list.
# =============================================================================

muxer:
  width: 1280
  height: 720
  batched_push_timeout_us: 40000   # 40 ms; raise to 100000 if any cam stalls
  live_source: true

pgie:
  config_file: /opt/parkguard/configs/pgie_yolo11s.txt

# SGIE ReID (Adım 6) — leave `enabled: false` for the 1-camera MVP.
# Flip to true after `scripts/build_tensorrt_engines.sh` has produced
# models/osnet_x0_25_veh_fp16.engine on the deployment host.
sgie:
  enabled: false
  config_file: /opt/parkguard/configs/sgie_osnet_reid.txt
  embedding_dim: 128

tracker:
  config_file: /opt/parkguard/configs/tracker_nvdcf.yml
  ll_lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  width: 640
  height: 384

kafka:
  brokers: "kafka:9092"
  topic_detections: "detections"
  client_id: "deepstream-host-01"
  compression: "lz4"

health:
  bind: "0.0.0.0"
  port: 9100

# Snapshot subsystem (spec §7.3, Adım 8). Enable once Kafka has the
# `snapshot_requests` / `snapshot_responses` topics and `/shared/snapshots`
# is mounted into the container. `output_dir` is where the C++ consumer
# writes JPEGs; the Python snapshot-consumer service then uploads to MinIO.
snapshot:
  enabled: false
  jpeg_quality_ring: 80          # ring-buffer full-frame JPEG quality
  jpeg_quality_crop: 85          # bbox re-crop JPEG quality
  ring_downscale_to_width: 0     # 0 = keep original; 1280 for bandwidth-constrained hosts
  topic_requests:  "snapshot_requests"
  topic_responses: "snapshot_responses"
  group_id:        "deepstream-snapshot"
  output_dir:      "/shared/snapshots"
  poll_timeout_ms: 500

cameras:
  - id: "cam_01"
    rtsp_url: "rtsp://demo:demo@192.168.1.10:554/stream1"
    enabled: true
