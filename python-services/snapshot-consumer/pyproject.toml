[project]
name = "parkguard-snapshot-consumer"
version = "0.8.0"
description = "ParkGuard KZ — drains snapshot_responses, uploads JPEGs to MinIO"
# The snapshot-consumer has no ML deps, so we track the same 3.12 baseline
# used by violation-service / event-api (spec §9).
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiokafka>=0.12,<0.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<25",
    "prometheus-client>=0.21,<1",
    "minio>=7.2,<8",
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ANN", "T20", "BLE"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
pythonpath = [".", ".."]
