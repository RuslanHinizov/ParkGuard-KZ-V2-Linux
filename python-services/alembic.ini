# ============================================================================
# python-services/alembic.ini
#
# Alembic configuration for ParkGuard KZ.  All Python services share one
# schema in the same Postgres database, so migrations live here at the
# python-services level rather than inside individual service directories.
#
# Usage:
#   cd python-services
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade -1          # roll back one step
#   alembic revision --autogenerate -m "add my_table"
#
# In CI/Docker the DATABASE_URL_SYNC env-var overrides the [alembic] url.
# ============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Fallback URL — always overridden by env-var in env.py.
sqlalchemy.url = postgresql+psycopg2://parkguard:CHANGE_ME@localhost:5432/parkguard

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
