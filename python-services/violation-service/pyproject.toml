[project]
name = "parkguard-violation-service"
version = "0.4.0"
description = "ParkGuard KZ — state machine + duplicate prevention"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.29,<0.31",
    "geoalchemy2>=0.15,<0.16",
    "aiokafka>=0.12,<0.13",
    "redis>=5.1,<6",
    "shapely>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<25",
    "tenacity>=9.0,<10",
    "minio>=7.2,<8",
    "prometheus-client>=0.21,<1",
    "numpy>=2.0,<3",
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.28",
    "aiosqlite>=0.20,<0.21",
    "fakeredis>=2.26,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ANN", "T20", "BLE"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
