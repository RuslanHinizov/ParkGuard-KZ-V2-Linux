[project]
name = "parkguard-event-api"
version = "0.1.0"
description = "ParkGuard KZ — Event API (REST + WebSocket, LAN-only, no auth)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ParkGuard KZ" }]

dependencies = [
    # Web
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "starlette>=0.41,<0.42",
    "websockets>=13.1,<14",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",

    # Config / validation
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # DB / migrations
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9.9",     # sync driver for alembic
    "alembic>=1.13,<2",
    "geoalchemy2>=0.15,<0.16",

    # Redis / Kafka / MinIO
    "redis>=5.1,<6",
    "aiokafka>=0.12,<0.13",
    "minio>=7.2,<8",

    # Logging / retries
    "structlog>=24.4,<25",
    "tenacity>=9.0,<10",

    # Geometry
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.28",
    "testcontainers[postgres,redis,kafka,minio]>=4.8,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ANN",              # annotations
    "S",                # security
    "T20",              # print/pprint banned (§18: logger only)
    "BLE",              # blind except banned (§18)
    "PT",               # pytest style
]
ignore = [
    "ANN101", "ANN102",  # self/cls annotations
    "S101",              # assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "T201"]
"migrations/**/*.py" = ["ANN", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
