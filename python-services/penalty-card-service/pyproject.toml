[project]
name = "parkguard-penalty-card-service"
version = "0.9.0"
description = "ParkGuard KZ — WeasyPrint PDF penalty card generator"
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiokafka>=0.12,<0.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<25",
    "prometheus-client>=0.21,<1",
    # DB — read violation row, write penalty_card_url back.
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    # MinIO — fetch snapshot, upload PDF.
    "minio>=7.2,<8",
    # PDF rendering.
    "weasyprint>=62,<66",
    "jinja2>=3.1,<4",
    # QR code embedded in card.
    "qrcode[pil]>=8.0,<9",
    "pillow>=11,<12",
    # Health HTTP server.
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ANN", "T20", "BLE"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
pythonpath = [".", ".."]
